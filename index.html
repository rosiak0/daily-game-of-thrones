<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Losowanie: Stół i Rowery</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Skala typograficzna */
            --text-h1: 26px;
            --text-lg: 18px;
            --text-base: 16px;
            
            /* Kolory stołu */
            --bg-color: #0f172a;
            --table-color: #1e293b;
            --table-border: #334155;
            --seat-empty: #1e293b;
            --seat-border: #475569;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --gradient-start: #6366f1;
            --gradient-end: #a855f7;
            
            /* Kolory rowerów */
            --bike-glow: rgba(16, 185, 129, 0.4);
            --bike-start: #10b981;
            --bike-end: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .snap-container {
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .screen-section {
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            position: relative;
        }

        button, .seat, .bike-card, .scroll-hint {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: var(--text-h1);
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: var(--text-base);
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--accent-glow);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
            margin-bottom: 30px;
        }

        button:active { transform: scale(0.97); }

        .btn-bikes {
            background: linear-gradient(135deg, var(--bike-start), var(--bike-end));
            box-shadow: 0 10px 20px var(--bike-glow);
        }

        /* --- STÓŁ --- */
        .layout-wrapper {
            position: relative;
            width: 360px;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table {
            position: absolute;
            width: 240px;
            height: 110px;
            background-color: var(--table-color);
            border: 1px solid var(--table-border);
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: 600;
            font-size: var(--text-lg);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .seat {
            position: absolute;
            width: 76px;
            height: 42px;
            background-color: var(--seat-empty);
            border: 2px dashed var(--seat-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .seat-0 { top: 10px; left: 70px; }
        .seat-1 { top: 10px; left: 214px; }
        .seat-2 { bottom: 10px; left: 70px; }
        .seat-3 { bottom: 10px; left: 214px; }
        .seat-4 { top: 74px; right: 0px; }

        .seat.occupied {
            background-color: #1e1b4b;
            border: 2px solid #818cf8;
            color: #e0e7ff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
            transform: scale(1.05);
        }

        /* --- ROWERY --- */
        .bikes-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .bike-card {
            background-color: var(--seat-empty);
            border: 1px solid var(--seat-border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bike-card .position {
            background-color: #334155;
            color: #e2e8f0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 16px;
            font-size: var(--text-base);
            transition: all 0.4s ease;
        }

        .bike-card.occupied {
            background-color: #064e3b; 
            border: 1px solid #34d399; 
            color: #ecfdf5;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            transform: scale(1.02);
        }

        .bike-card.occupied .position {
            background-color: #34d399;
            color: #064e3b;
        }

        .waiting { opacity: 0.5; transform: scale(0.95); }

        /* Wskaźniki przewijania */
        .scroll-hint {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .scroll-hint-down {
            bottom: max(16px, env(safe-area-inset-bottom));
            animation: bounce-down 2s infinite;
        }

        .scroll-hint-up {
            top: max(16px, env(safe-area-inset-top));
            animation: bounce-up 2s infinite;
        }

        .scroll-hint svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes bounce-down {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        @keyframes bounce-up {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(6px); }
            60% { transform: translateY(3px); }
        }

        @media (max-width: 380px) {
            .layout-wrapper { transform: scale(0.85); }
        }
    </style>
</head>
<body>

    <div class="snap-container" id="snapContainer">
        
        <!-- EKRAN 1: STÓŁ -->
        <section class="screen-section" id="section-table">
            <h1>Rozkład Miejsc przy Stole</h1>
            <button onclick="drawSeats()">Losuj</button>

            <div class="layout-wrapper">
                <div class="table"></div>
                <div id="seat-0" class="seat seat-0">Wolne</div>
                <div id="seat-1" class="seat seat-1">Wolne</div>
                <div id="seat-2" class="seat seat-2">Wolne</div>
                <div id="seat-3" class="seat seat-3">Wolne</div>
                <div id="seat-4" class="seat seat-4">Wolne</div>
            </div>

            <div class="scroll-hint scroll-hint-down" onclick="scrollToBikes()">
                <span>Rowery</span>
                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
            </div>
        </section>

        <!-- EKRAN 2: ROWERY -->
        <section class="screen-section" id="section-bikes">
            <div class="scroll-hint scroll-hint-up" onclick="scrollToTable()">
                <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"></path></svg>
                <span>Stół</span>
            </div>

            <h1>Kolejność na Rowerach</h1>
            <button class="btn-bikes" onclick="drawBikes()">Losuj</button>

            <div class="bikes-container">
                <div id="bike-0" class="bike-card"><div class="position">1</div> <span class="name">...</span></div>
                <div id="bike-1" class="bike-card"><div class="position">2</div> <span class="name">...</span></div>
                <div id="bike-2" class="bike-card"><div class="position">3</div> <span class="name">...</span></div>
            </div>
        </section>

    </div>

    <script>
        const peopleTable = ["mama", "tata", "Ala", "Zosia", "Iga"];
        const peopleBikes = ["Ala", "Zosia", "Iga"];
        
        let isTableAnimating = false;
        let isBikeAnimating = false;

        function triggerHaptic() {
            if ('vibrate' in navigator) {
                navigator.vibrate(15);
            }
        }

        function scrollToBikes() {
            document.getElementById('section-bikes').scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToTable() {
            document.getElementById('section-table').scrollIntoView({ behavior: 'smooth' });
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function drawSeats() {
            if (isTableAnimating) return;
            triggerHaptic();
            isTableAnimating = true;

            const shuffled = shuffleArray(peopleTable);
            const seats = document.querySelectorAll('.seat');
            
            seats.forEach(seat => {
                seat.classList.remove('occupied');
                seat.classList.add('waiting');
                seat.textContent = '...';
            });

            shuffled.forEach((person, i) => {
                setTimeout(() => {
                    const seatElement = document.getElementById(`seat-${i}`);
                    seatElement.classList.remove('waiting');
                    seatElement.classList.add('occupied');
                    seatElement.textContent = person;
                    
                    if (i === 4) isTableAnimating = false;
                }, (i + 1) * 200);
            });
        }

        function drawBikes() {
            if (isBikeAnimating) return;
            triggerHaptic();
            isBikeAnimating = true;

            const shuffled = shuffleArray(peopleBikes);
            const bikes = document.querySelectorAll('.bike-card');
            
            bikes.forEach(bike => {
                bike.classList.remove('occupied');
                bike.classList.add('waiting');
                bike.querySelector('.name').textContent = '...';
            });

            shuffled.forEach((person, i) => {
                setTimeout(() => {
                    const bikeElement = document.getElementById(`bike-${i}`);
                    bikeElement.classList.remove('waiting');
                    bikeElement.classList.add('occupied');
                    bikeElement.querySelector('.name').textContent = person;
                    
                    if (i === 2) isBikeAnimating = false;
                }, (i + 1) * 200);
            });
        }
    </script>

</body>
</html>
