<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Losowanie miejsc</title>
    <style>
        /* Główne style i nowoczesny Dark Mode */
        :root {
            --bg-color: #0f172a; /* Głęboki, elegancki granat/czerń */
            --table-color: #1e293b;
            --table-border: #334155;
            --seat-empty: #1e293b;
            --seat-border: #475569;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --gradient-start: #6366f1; /* Nowoczesny fiolet/indygo */
            --gradient-end: #a855f7;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Przycisk w stylu Glass/Modern */
        button {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--accent-glow);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 60px;
            outline: none;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(168, 85, 247, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Kontener i Stół */
        .layout-wrapper {
            position: relative;
            width: 380px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table {
            position: absolute;
            width: 260px;
            height: 120px;
            background-color: var(--table-color);
            border: 1px solid var(--table-border);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Miejsca */
        .seat {
            position: absolute;
            width: 80px;
            height: 44px;
            background-color: var(--seat-empty);
            border: 2px dashed var(--seat-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        /* Precyzyjne pozycjonowanie na krawędziach stołu */
        .seat-0 { top: 12px; left: 80px; }       /* Góra, lewo */
        .seat-1 { top: 12px; left: 220px; }      /* Góra, prawo */
        .seat-2 { bottom: 12px; left: 80px; }    /* Dół, lewo */
        .seat-3 { bottom: 12px; left: 220px; }   /* Dół, prawo */
        .seat-4 { top: 78px; right: 0px; }       /* Prawy bok (krótszy) */

        /* Stan dla wylosowanego miejsca */
        .seat.occupied {
            background-color: #1e1b4b; /* Ciemny indygo */
            border: 2px solid #818cf8; /* Jasny indygo */
            color: #e0e7ff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
            transform: scale(1.05);
        }

        /* Subtelna animacja pulsująca w trakcie czekania */
        .seat.waiting {
            opacity: 0.5;
            transform: scale(0.95);
        }

        /* Responsywność dla małych ekranów telefonicznych */
        @media (max-width: 400px) {
            .layout-wrapper { transform: scale(0.85); }
        }
    </style>
</head>
<body>

    <h1>Rozkład Miejsc</h1>
    <button onclick="drawSeats()">Losuj</button>

    <div class="layout-wrapper">
        <div class="table"></div>
        
        <div id="seat-0" class="seat seat-0">Wolne</div>
        <div id="seat-1" class="seat seat-1">Wolne</div>
        <div id="seat-2" class="seat seat-2">Wolne</div>
        <div id="seat-3" class="seat seat-3">Wolne</div>
        <div id="seat-4" class="seat seat-4">Wolne</div>
    </div>

    <script>
        const people = ["mama", "tata", "Ala", "Zosia", "Iga"];
        let isAnimating = false; // Zabezpieczenie przed wielokrotnym klikaniem

        function drawSeats() {
            if (isAnimating) return;
            isAnimating = true;

            // Algorytm Fishera-Yatesa do tasowania
            let shuffled = [...people];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const seats = document.querySelectorAll('.seat');
            
            // Faza 1: Zresetowanie miejsc przed nowym losowaniem
            seats.forEach(seat => {
                seat.classList.remove('occupied');
                seat.classList.add('waiting');
                seat.textContent = '...';
            });

            // Faza 2: Kaskadowe (pojedyncze) pojawianie się imion dla efektu "wow"
            shuffled.forEach((person, i) => {
                setTimeout(() => {
                    const seatElement = document.getElementById(`seat-${i}`);
                    seatElement.classList.remove('waiting');
                    seatElement.classList.add('occupied');
                    seatElement.textContent = person;
                    
                    // Odblokuj przycisk po ostatniej animacji
                    if (i === 4) isAnimating = false;
                }, (i + 1) * 200); // Każde miejsce pojawia się co 200ms
            });
        }
    </script>

</body>
</html>
