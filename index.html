<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Losowanie: Stół i Rowery</title>
    <style>
        :root {
            /* Skala typograficzna (Gwarantuje spójność) */
            --text-h1: 28px;
            --text-h2: 24px;
            --text-lg: 20px; /* Napis Stół */
            --text-base: 16px; /* Imiona, przyciski, numery */
            
            /* Kolory stołu */
            --bg-color: #0f172a;
            --table-color: #1e293b;
            --table-border: #334155;
            --seat-empty: #1e293b;
            --seat-border: #475569;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --gradient-start: #6366f1;
            --gradient-end: #a855f7;
            
            /* Kolory rowerów */
            --bike-glow: rgba(16, 185, 129, 0.4);
            --bike-start: #10b981;
            --bike-end: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        h1, h2 {
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        h1 { font-size: var(--text-h1); }
        h2 { font-size: var(--text-h2); margin-top: 20px; }

        /* Główne style przycisków */
        button {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: var(--text-base);
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--accent-glow);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
            margin-bottom: 40px;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(168, 85, 247, 0.5); }
        button:active { transform: translateY(1px); }

        .btn-bikes {
            background: linear-gradient(135deg, var(--bike-start), var(--bike-end));
            box-shadow: 0 10px 20px var(--bike-glow);
        }
        .btn-bikes:hover { box-shadow: 0 15px 25px rgba(16, 185, 129, 0.5); }

        /* --- STÓŁ --- */
        .layout-wrapper {
            position: relative;
            width: 380px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .table {
            position: absolute;
            width: 260px;
            height: 120px;
            background-color: var(--table-color);
            border: 1px solid var(--table-border);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: 600;
            font-size: var(--text-lg);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .seat {
            position: absolute;
            width: 80px;
            height: 44px;
            background-color: var(--seat-empty);
            border: 2px dashed var(--seat-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .seat-0 { top: 12px; left: 80px; }
        .seat-1 { top: 12px; left: 220px; }
        .seat-2 { bottom: 12px; left: 80px; }
        .seat-3 { bottom: 12px; left: 220px; }
        .seat-4 { top: 78px; right: 0px; }

        .seat.occupied {
            background-color: #1e1b4b;
            border: 2px solid #818cf8;
            color: #e0e7ff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
            transform: scale(1.05);
        }

        /* --- ROWERY --- */
        .bikes-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .bike-card {
            background-color: var(--seat-empty);
            border: 1px solid var(--seat-border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bike-card .position {
            background-color: #334155;
            color: #e2e8f0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 16px;
            font-size: var(--text-base);
            transition: all 0.4s ease;
        }

        .bike-card.occupied {
            background-color: #064e3b; 
            border: 1px solid #34d399; 
            color: #ecfdf5;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            transform: scale(1.02);
        }

        .bike-card.occupied .position {
            background-color: #34d399;
            color: #064e3b;
        }

        /* Wspólna animacja ładowania */
        .waiting { opacity: 0.5; transform: scale(0.95); }

        .divider {
            width: 100%;
            max-width: 400px;
            height: 1px;
            background: var(--table-border);
            margin: 30px 0;
        }

        @media (max-width: 400px) {
            .layout-wrapper { transform: scale(0.85); margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <!-- SEKCJA STOŁU -->
    <h1>Rozkład Miejsc przy Stole</h1>
    <button onclick="drawSeats()">Losuj</button>

    <div class="layout-wrapper">
        <div class="table"></div>
        
        <div id="seat-0" class="seat seat-0">Wolne</div>
        <div id="seat-1" class="seat seat-1">Wolne</div>
        <div id="seat-2" class="seat seat-2">Wolne</div>
        <div id="seat-3" class="seat seat-3">Wolne</div>
        <div id="seat-4" class="seat seat-4">Wolne</div>
    </div>

    <!-- LINIA ODDZIELAJĄCA -->
    <div class="divider"></div>

    <!-- SEKCJA ROWERÓW -->
    <h2>Kolejność na Rowerach</h2>
    <button class="btn-bikes" onclick="drawBikes()">Losuj</button>

    <div class="bikes-container">
        <div id="bike-0" class="bike-card"><div class="position">1</div> <span class="name">...</span></div>
        <div id="bike-1" class="bike-card"><div class="position">2</div> <span class="name">...</span></div>
        <div id="bike-2" class="bike-card"><div class="position">3</div> <span class="name">...</span></div>
    </div>

    <script>
        // Listy uczestników
        const peopleTable = ["mama", "tata", "Ala", "Zosia", "Iga"];
        const peopleBikes = ["Ala", "Zosia", "Iga"];
        
        let isTableAnimating = false;
        let isBikeAnimating = false;

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function drawSeats() {
            if (isTableAnimating) return;
            isTableAnimating = true;

            const shuffled = shuffleArray(peopleTable);
            const seats = document.querySelectorAll('.seat');
            
            seats.forEach(seat => {
                seat.classList.remove('occupied');
                seat.classList.add('waiting');
                seat.textContent = '...';
            });

            shuffled.forEach((person, i) => {
                setTimeout(() => {
                    const seatElement = document.getElementById(`seat-${i}`);
                    seatElement.classList.remove('waiting');
                    seatElement.classList.add('occupied');
                    seatElement.textContent = person;
                    
                    if (i === 4) isTableAnimating = false;
                }, (i + 1) * 200);
            });
        }

        function drawBikes() {
            if (isBikeAnimating) return;
            isBikeAnimating = true;

            const shuffled = shuffleArray(peopleBikes);
            const bikes = document.querySelectorAll('.bike-card');
            
            bikes.forEach(bike => {
                bike.classList.remove('occupied');
                bike.classList.add('waiting');
                bike.querySelector('.name').textContent = '...';
            });

            shuffled.forEach((person, i) => {
                setTimeout(() => {
                    const bikeElement = document.getElementById(`bike-${i}`);
                    bikeElement.classList.remove('waiting');
                    bikeElement.classList.add('occupied');
                    bikeElement.querySelector('.name').textContent = person;
                    
                    if (i === 2) isBikeAnimating = false;
                }, (i + 1) * 200);
            });
        }
    </script>

</body>
</html>
